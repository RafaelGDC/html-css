<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        table {
            width: 400px;
            border-collapse: collapse;
        }
        caption { 
            font-weight: bold;
            font-size: 1.7em;
            padding: 8px;
            background-color: rgba(134, 134, 134, 0.479);
        }

        tbody > tr:nth-child(even) {
            background-color: white;
        }

        tbody > tr:nth-child(odd) {
            background-color: lightgrey;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }
        thead {
            background-color: black;
            color: white;
        }
        .numero {
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <table>
        <caption>Copa do Mundo</caption>
        <thead>
            <tr>
                <th scope="col">Grupo C</th>
                <th scope="col" style="width: 40px;">Pontos</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Brasil</td>
                <td class="numero">0</td>
            </tr>
            <tr>
                <td>Marrocos</td>
                <td class="numero">0</td>
            </tr>
            <tr>
                <td>Haiti</td>
                <td class="numero">0</td>
            </tr>
            <tr>
                <td>Escócia</td>
                <td class="numero">0</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th scope="row">Equipe finalista</th>
                <td class="numero">-</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
