<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        td {
            border: 1px solid black;
            padding: 5px;
            vertical-align: center;
        }
        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
            border: 4px solid rgb(50, 86, 161);
        }
        .cor1 {
            background-color: rgb(235, 205, 160);
            text-align: right;
        }
        .cor2 {
            background-color: rgb(221, 221, 173);
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <table>
        <tr class="cor1">
            <td>A1</td>
            <td>B2</td>
            <td>C3</td>
        </tr>
        <tr>
            <td>A1</td>
            <td>B2</td>
            <td>C3</td>
        </tr>
        <tr>
            <td>A1</td>
            <td class="cor2">B2</td>
            <td>C3</td>
        </tr>
    </table>
</body>
</html>
