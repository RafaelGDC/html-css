<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            height: 600px;
            width: 600px;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do 
        <iframe src="https://www.cursoemvideo.com/" frameborder="0" height="400" scolling="auto">
            <a href="https://www.cursoemvideo.com/">Curso em Vídeo</a>
        </iframe> para aprender iframe</p>
    <p>Acessando o site do 
        <iframe src="https://gustavoguanabara.github.io/html-css/exercicios/" frameborder="0" height="500" width="500">
            <a href="https://gustavoguanabara.github.io/html-css/exercicios/">material</a>
        </iframe> para baixar o material</p>
</body>
</html>
